# Render Blueprint Specification for upay Pulse
# Deploy: In Render Dashboard, select "Blueprints" -> "New Blueprint Instance" -> Connect repository.
version: "1"

databases:
  - name: upay-pulse-db
    databaseName: upay_pulse
    user: upay_user
    plan: free
    region: oregon

services:
  # --------------------------------------------------------------------------
  # 1. Backend Web Service (FastAPI + LightGBM Risk Engine + Customer AI)
  # --------------------------------------------------------------------------
  - type: web
    name: upay-pulse-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: python scripts/init_db.py && python scripts/seed_baseline.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: upay-pulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173"
      - key: AI_PROVIDER
        value: "mock" # Set to "gemini" in Render dashboard once GEMINI_API_KEY is supplied
      - key: GEMINI_API_KEY
        sync: false

  # --------------------------------------------------------------------------
  # 2. Frontend Static Site (React 18 + Vite + TailwindCSS + Lucide + Recharts)
  # --------------------------------------------------------------------------
  - type: static
    name: upay-pulse-frontend
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # Set this to your backend service URL, e.g. https://upay-pulse-api.onrender.com/api/v1
        sync: false
