version: "1"

databases:
  - name: upay-pulse-db
    databaseName: upay_pulse
    user: upay_user
    plan: free
    region: oregon

services:
  - type: web
    name: upay-pulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: upay-pulse-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: AI_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_REDIS_FALLBACK
        value: "true"

  - type: web
    name: upay-pulse-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
